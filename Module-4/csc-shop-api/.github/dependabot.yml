# Bài 40 — Dependabot opens PRs for outdated dependencies automatically.
#
# Pinned GitHub Actions (`actions/checkout@v4`) are the easiest supply-chain risk to
# forget: nothing in the app breaks when they go stale, so nobody notices until an
# action is deprecated or a CVE lands.

version: 2
updates:
  # 1. The actions used by ci.yml / cd.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # 2. npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for all patch/minor bumps instead of twenty. Majors stay separate
      # because they need a human to read the changelog.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # 3. The base images in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
