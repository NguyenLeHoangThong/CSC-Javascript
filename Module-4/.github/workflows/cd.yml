# Bài 40 — Continuous Deployment (backend -> Render).
#
# Tách khỏi ci.yml để pull request chạy đủ kiểm tra mà không bao giờ chạm production.
#
# Cần làm một lần, ngoài code:
#   Render Dashboard -> Web Service -> Settings -> Deploy Hook -> copy URL
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#     name: RENDER_DEPLOY_HOOK
#
# (Frontend không cần workflow: Vercel tự deploy khi có commit mới trên main.)

name: CD

on:
  push:
    branches: [main] # chỉ khi merge vào main, không chạy trên pull request

permissions:
  contents: read

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csc-shop-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: csc-shop-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: verify # `needs` là cái chốt: code hỏng không bao giờ tới production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Call the Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Báo lỗi rõ ràng nếu secret chưa được cấu hình, thay vì curl vào chuỗi rỗng.
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          # --fail biến HTTP 4xx/5xx thành exit code khác 0, để hook bị từ chối hiện
          # thành build đỏ chứ không phải màu xanh dối trá.
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          echo "✅ Deploy triggered"
